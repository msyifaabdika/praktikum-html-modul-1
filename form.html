<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Registrasi</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 20px;
            font-size: 14px;
        }
        h2 {
            margin-bottom: 20px;
        }
        fieldset {
            border: 1px solid #000;
            margin-bottom: 15px;
            padding: 10px 15px;
        }
        legend {
            font-weight: normal;
            padding: 0 5px;
        }
        table {
            border-collapse: collapse;
        }
        td {
            padding: 3px 5px;
            vertical-align: middle;
        }
        td:first-child {
            width: 200px;
        }
        input[type="text"], 
        input[type="email"], 
        input[type="password"], 
        textarea {
            width: 250px;
            padding: 2px 4px;
            border: 1px solid #777;
            border-radius: 2px;
            box-sizing: border-box;
        }
        textarea {
            height: 80px;
            resize: vertical;
        }
        select {
            padding: 2px;
            border: 1px solid #777;
        }
        .action-buttons input {
            margin-right: 5px;
            padding: 2px 8px;
        }
    </style>
</head>
<body>

    <h2>Form Registrasi</h2>

    <form action="" method="post" enctype="multipart/form-data">
        
        
        <fieldset>
            <legend>Biodata</legend>
            <table>
                <tr>
                    <td>Nama Mahasiswa</td>
                    <td>: <input type="text" name="nama_mahasiswa" placeholder="Nama Anda"></td>
                </tr>
                <tr>
                    <td>No Induk Mahasiswa (NIM)</td>
                    <td>: <input type="text" name="nim" value="123456780"></td>
                </tr>
                <tr>
                    <td style="vertical-align: top; padding-top: 5px;">Alamat Mahasiswa</td>
                    <td>: <textarea name="alamat" placeholder="Alamat Anda"></textarea></td>
                </tr>
                <tr>
                    <td>Tanggal Lahir</td>
                    <td>: 
                        <select name="tgl">
                            <option value="01" selected>01</option>
                            <option value="02">02</option>
                            <option value="03">03</option>
                        </select>
                        <select name="bln">
                            <option value="Januari" selected>Januari</option>
                            <option value="Februari">Februari</option>
                            <option value="Maret">Maret</option>
                        </select>
                        <select name="thn">
                            <option value="1990" selected>1990</option>
                            <option value="1991">1991</option>
                            <option value="1992">1992</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Jenis Kelamin</td>
                    <td>: 
                        <input type="radio" id="pria" name="jk" value="Pria" checked>
                        <label for="pria">Pria</label>
                        <input type="radio" id="wanita" name="jk" value="Wanita">
                        <label for="wanita">Wanita</label>
                    </td>
                </tr>
                <tr>
                    <td>Upload Foto</td>
                    <td>: <input type="file" name="foto"></td>
                </tr>
                <tr>
                    <td>URL Website</td>
                    <td>: <input type="text" name="url_website" placeholder="URL Website Anda"></td>
                </tr>
                <tr>
                    <td>Perguruan Tinggi</td>
                    <td>: <input type="text" name="perguruan_tinggi"></td>
                </tr>
            </table>
        </fieldset>

        <fieldset>
            <legend>Info Akun</legend>
            <table>
                <tr>
                    <td>Email</td>
                    <td>: <input type="email" name="email" placeholder="Email Anda"></td>
                </tr>
                <tr>
                    <td>Username</td>
                    <td>: <input type="text" name="username" placeholder="Username Anda"></td>
                </tr>
                <tr>
                    <td>Password</td>
                    <td>: <input type="password" name="password" placeholder="Password Anda"></td>
                </tr>
                <tr>
                    <td>Ulangi Password</td>
                    <td>: <input type="password" name="repeat_password" placeholder="Password Anda"></td>
                </tr>
            </table>
        </fieldset>

    
        <fieldset>
            <legend>Kemampuan Dasar</legend>
            <div style="padding: 5px 0;">
                <input type="checkbox" id="html" name="skill[]" value="HTML"><label for="html">HTML</label>
                <input type="checkbox" id="css" name="skill[]" value="CSS"><label for="css">CSS</label>
                <input type="checkbox" id="js" name="skill[]" value="Javascript"><label for="js">Javascript</label>
                <input type="checkbox" id="php" name="skill[]" value="PHP"><label for="php">PHP</label>
                <input type="checkbox" id="mysql" name="skill[]" value="MySQL"><label for="mysql">MySQL</label>
                <input type="checkbox" id="laravel" name="skill[]" value="Laravel"><label for="laravel">Laravel</label>
                <input type="checkbox" id="react" name="skill[]" value="React Native"><label for="react">React Native</label>
            </div>
        </fieldset>

    
        <div class="action-buttons">
            <input type="reset" value="Reset">
            <input type="submit" value="Simpan">
            <input type="button" value="Button">
        </div>

    </form>

</body>
</html>
